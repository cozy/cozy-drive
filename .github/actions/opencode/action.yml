name: OpenCode
description: Run a pinned OpenCode release on the current event

# Replaces anomalyco/opencode/github, whose first step resolves the latest
# release through the unauthenticated GitHub API and fails the job whenever
# the shared runner IP is rate limited (anomalyco/opencode#35120, closed as
# not planned). The action also installs the latest CLI whatever SHA it is
# pinned to (anomalyco/opencode#39163); an npm version is immutable, so this
# one always runs the same code next to our secrets.

inputs:
  model:
    description: Model to use, as provider/model
    required: true
  prompt:
    description: Prompt overriding the default one
    required: false
  version:
    description: opencode-ai npm version
    required: false
    default: '1.18.32'

runs:
  using: composite
  steps:
    # The gateway is a LiteLLM proxy: it only knows its own model names,
    # so it is declared as a plain OpenAI-compatible provider.
    # Nobody can answer a permission prompt on a runner: an "ask" waits until
    # the job times out, so the permissions that default to it are denied.
    - name: Run OpenCode
      shell: bash
      run: |
        OPENCODE_CONFIG_CONTENT=$(jq -nc --arg model "${MODEL#*/}" '{
          provider: {linagora: {
            npm: "@ai-sdk/openai-compatible",
            options: {baseURL: "{env:AI_API_BASE_URL}", apiKey: "{env:AI_API_KEY}"},
            models: {($model): {}}
          }},
          small_model: env.MODEL,
          permission: {external_directory: "deny", doom_loop: "deny"}
        }')
        export OPENCODE_CONFIG_CONTENT
        npx --yes "opencode-ai@$VERSION" github run
      env:
        VERSION: ${{ inputs.version }}
        MODEL: ${{ inputs.model }}
        PROMPT: ${{ inputs.prompt }}
        SHARE: 'false'
        USE_GITHUB_TOKEN: 'true'
