name: OpenCode verify findings

# Audits what the other reviewers claimed, it does not review the code.
# See .github/prompts/verify-findings.md.
#
# Runs on request only: OpenCode requires the comment author to have write
# access, which reviewer bots lack, and a comment posted with GITHUB_TOKEN
# never starts a workflow.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  verify:
    if: >-
      (github.event.issue.pull_request != null || github.event.pull_request != null)
      && contains(github.event.comment.body, '/oc verify')
      && contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association)
    # A new request replaces the verification still running.
    concurrency:
      group: opencode-verify-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject fork pull requests
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          head_repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -q .head.repo.full_name)
          echo "head_repo=$head_repo" >> "$GITHUB_OUTPUT"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::notice::skipping verification of fork pull request $head_repo"
          fi

      - name: Load verification prompt
        if: steps.pr.outputs.head_repo == github.repository
        id: prompt
        run: |
          {
            echo 'text<<PROMPT_EOF'
            cat .github/prompts/verify-findings.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run OpenCode
        if: steps.pr.outputs.head_repo == github.repository
        uses: ./.github/actions/opencode
        env:
          AI_API_BASE_URL: ${{ secrets.AI_API_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ vars.OPENCODE_VERIFY_MODEL || vars.OPENCODE_REVIEW_MODEL || 'linagora/deepseek-v4.1-flash' }}
          prompt: ${{ steps.prompt.outputs.text }}
