name: E2E Tests

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  e2e:
    name: ${{ matrix.suite == 'scribe' && 'Scribe E2E' || format('Drive E2E ({0}/4)', matrix.shard) }}
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e') ||
      contains(github.event.pull_request.labels.*.name, 'e2e-scribe')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # The cases of the scribe plugin run in a job of their own, so that each
    # suite can be run alone: the label e2e-scribe runs only them.
    # The Drive suite is split into shards, each with its own stack: when its
    # jobs get too long, add a shard here, to the exclusions and to the total
    # in the job name and the test command
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'e2e') && '["scribe"]' || '["drive", "scribe"]') }}
        shard: [1, 2, 3, 4]
        exclude:
          - suite: scribe
            shard: 2
          - suite: scribe
            shard: 3
          - suite: scribe
            shard: 4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Drive app
        run: yarn build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run E2E tests
        run: yarn e2e ${{ matrix.suite == 'scribe' && '--grep @e2e-scribe' || format('--grep-invert @e2e-scribe --shard={0}/4', matrix.shard) }}

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.suite }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces-${{ matrix.suite }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
